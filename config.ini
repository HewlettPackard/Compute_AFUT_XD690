[Options]
power_state = NA
## Used by power_control.yml. Allowed options:
## "NA"           - just report the current power state, no action
## "on"           - power on if currently off
## "off"          - power off if currently on
## "reboot"       - Redfish graceful reboot
## "ac_cycle"     - IPMI AC power cycle

