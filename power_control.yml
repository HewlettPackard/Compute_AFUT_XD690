---
- hosts: xds
  connection: local
  name: version 1.0 Power control for HPE Cray XD690 systems (on/off/reboot/ac_cycle)
  gather_facts: yes
  vars:
    bmc_username: "{{ inputs[inventory_hostname].user }}"
    bmc_password: "{{ inputs[inventory_hostname].password }}"
    baseuri: "{{ ansible_ssh_host }}"

  tasks:
  - name: Ensure logs directory exists
    file:
      path: logs
      state: directory
    run_once: True

  - name: Power state result will be stored in the below csv file
    set_fact:
      output_file: "logs/Power_State_{{ ansible_date_time.date }}_{{ ansible_date_time.time }}.csv"
    run_once: True

  - name: Apply the power_state option from config.ini ("NA"/"on"/"off"/"reboot"/"ac_cycle")
    get_power_state:
      category: Get_Power_State
      command: ["Get_PS"]
      baseuri: "{{ baseuri }}"
      username: "{{ bmc_username }}"
      password: "{{ bmc_password }}"
      output_file_name: "{{ output_file }}"
    register: power_output

  - name: Power control module result
    debug:
      var: power_output.msg
