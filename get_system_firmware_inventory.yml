---
- hosts: xds
  connection: local
  name: version 1.0 Fetches the AFUT supported Cray XD servers System Firmware Inventory Details along with Model name
  gather_facts: yes
  vars:
    bmc_username: "{{ inputs[inventory_hostname].user }}"
    bmc_password: "{{ inputs[inventory_hostname].password }}"
    baseuri: "{{ ansible_ssh_host }}"
    datatype: FirmwareInventory

  tasks:
  - name: Ensure logs directory exists
    file:
      path: logs
      state: directory
    run_once: True

  - name: System firmware Inventory Details will be stored in the below json file
    set_fact:
      output_file: "logs/All_System_FW_Inventory_{{ ansible_date_time.date }}_{{ ansible_date_time.time }}.json"
    run_once: True

  - name: Fetching Inventory Details
    get_system_fw_inv:
      category: GetInventory
      command: ["GetSystemFWInventory"]
      baseuri: "{{ baseuri }}"
      username: "{{ bmc_username }}"
      password: "{{ bmc_password }}"
      output_file_name: "{{output_file}}"
    register: inv_output

  - name: Inventory module result
    debug:
      var: inv_output.msg
